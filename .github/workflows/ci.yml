name: ci
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: chmod +x mvnw && ./mvnw -B test
  docker:
    needs: build-test
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} .
      - name: Login to Azure Container Registry
        if: github.ref == 'refs/heads/main' && vars.ACR_LOGIN_SERVER != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Push image
        if: github.ref == 'refs/heads/main' && vars.ACR_LOGIN_SERVER != ''
        run: |
          docker tag $IMAGE:${{ github.sha }} ${{ vars.ACR_LOGIN_SERVER }}/$IMAGE:${{ github.sha }}
          docker tag $IMAGE:${{ github.sha }} ${{ vars.ACR_LOGIN_SERVER }}/$IMAGE:latest
          docker push ${{ vars.ACR_LOGIN_SERVER }}/$IMAGE:${{ github.sha }}
          docker push ${{ vars.ACR_LOGIN_SERVER }}/$IMAGE:latest
