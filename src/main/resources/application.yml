server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: rumi-api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Routes are evaluated in the order they are listed: the first match wins.
          routes:
            # Must stay before building-service: /api/v1/buildings/** would capture it otherwise.
            - id: seismic-service-building-risk-indexes
              uri: ${SEISMIC_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/buildings/{buildingId}/risk-indexes/**
            - id: building-service
              uri: ${BUILDING_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/buildings/**,/api/v1/sensors/**,/api/v1/invitations/**
            - id: monitoring-service
              uri: ${MONITORING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/readings/**,/api/v1/digital-twin/**
            - id: seismic-service
              uri: ${SEISMIC_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/seismic-events/**,/api/v1/risk-indexes/**,/api/v1/reports/**
            - id: iam-service
              uri: ${IAM_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/authentication/**,/api/v1/users/**,/api/v1/device-tokens/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/alerts/**,/api/v1/thresholds/**
            - id: safety-service
              uri: ${SAFETY_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/evacuation-plans/**,/api/v1/checklists/**
            - id: billing-service
              uri: ${BILLING_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/v1/subscriptions/**,/api/v1/payments/**
            - id: maintenance-service
              uri: ${MAINTENANCE_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/v1/inspections/**,/api/v1/damage-reports/**

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
